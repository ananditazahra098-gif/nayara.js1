
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Student Grade Checker</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

            <h1 class="text-2xl font-bold text-center text-indigo-600 mb-6">
                Student Grade Checker
            </h1>

            <label class="block mb-2">Student Name</label>
            <input type="text" id="name" class="w-full border rounded-lg p-3 mb-4" placeholder="Enter student name">

            <label class="block mb-2">Score (0-100)</label>
            <input type="number" id="score" class="w-full border rounded-lg p-3 mb-4" placeholder="Enter score (0-100)" min="0" max="100">

            <button onclick="checkGrade()" class="w-full bg-indigo-600 text-white p-3 rounded-lg hover:bg-indigo-700">
                Check Grade
            </button>

            <div id="result" class="mt-6 text-center"></div>
        </div>

        <script>
            function checkGrade() {
                // Get input values
                let name = document.getElementById("name").value;
                let scoreInput = document.getElementById("score").value;
                let score = Number(scoreInput);

                let grade;
                let status;

                // Validate input
                if (name.trim() === "" || scoreInput === "" || score < 0 || score > 100) {
                    document.getElementById("result").innerHTML =
                        "<p class='text-red-500'>Please enter a valid name and score (0-100)!</p>";
                    return;
                }

                // Check grade using conditions
                if (score >= 85) {
                    grade = "A";
                } else if (score >= 70) {
                    grade = "B";
                } else if (score >= 60) {
                    grade = "C";
                } else if (score >= 50) {
                    grade = "D";
                } else {
                    grade = "E";
                }

                // Check pass or fail
                if (score >= 70) {
                    status = "Pass";
                } else {
                    status = "Fail";
                }

                // Display result
                document.getElementById("result").innerHTML =
                    "<h2 class='text-xl font-bold'>Result</h2>" +
                    "<p>Name: " + name + "</p>" +
                    "<p>Score: " + score + "</p>" +
                    "<p>Grade: " + grade + "</p>" +
                    "<p>Status: " + status + "</p>";
            }
        </script>

    </body>
</html>
